<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Habit Tracker</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
        }

        /* ── Auth screens ─────────────────────────────────────────────────── */
        #loadingScreen, #loginScreen {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }

        #appScreen {
            display: none;
            padding: 20px;
            padding-bottom: 80px;
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid rgba(255,255,255,0.3);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* Login card — matches Bible tracker style */
        .login-card {
            background: rgba(255,255,255,0.08);
            border: 1px solid rgba(255,255,255,0.18);
            border-radius: 24px;
            padding: 52px 44px 44px;
            width: 100%;
            max-width: 460px;
            text-align: center;
            backdrop-filter: blur(12px);
            box-shadow: 0 24px 64px rgba(0,0,0,0.25);
        }

        .login-icon {
            font-size: 56px;
            margin-bottom: 20px;
            display: block;
        }

        .login-title {
            font-size: 32px;
            font-weight: 700;
            color: white;
            letter-spacing: 4px;
            text-transform: uppercase;
            margin-bottom: 10px;
            line-height: 1.2;
            font-family: 'Palatino Linotype', 'Book Antiqua', Palatino, Georgia, serif;
        }

        .login-subtitle {
            font-size: 15px;
            color: rgba(255,255,255,0.7);
            margin-bottom: 40px;
        }

        .google-btn {
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            padding: 16px 24px;
            background: linear-gradient(135deg, rgba(255,255,255,0.25), rgba(255,255,255,0.15));
            border: 1px solid rgba(255,255,255,0.35);
            border-radius: 12px;
            color: white;
            font-size: 17px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            margin-bottom: 20px;
            letter-spacing: 0.3px;
        }

        .google-btn:hover {
            background: linear-gradient(135deg, rgba(255,255,255,0.35), rgba(255,255,255,0.22));
            transform: translateY(-1px);
            box-shadow: 0 8px 24px rgba(0,0,0,0.15);
        }

        .google-btn:active { transform: scale(0.98); }

        .login-footer {
            font-size: 13px;
            color: rgba(255,255,255,0.5);
        }

        /* ── App layout ───────────────────────────────────────────────────── */
        .container { max-width: 600px; margin: 0 auto; }

        .header {
            text-align: center;
            color: white;
            margin-bottom: 30px;
        }

        .header h1 { font-size: 32px; margin-bottom: 6px; }
        .header p  { font-size: 14px; opacity: 0.85; }

        .user-bar {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-top: 14px;
        }

        .user-avatar {
            width: 30px; height: 30px;
            border-radius: 50%;
            border: 2px solid rgba(255,255,255,0.6);
            object-fit: cover;
        }

        .user-avatar-placeholder {
            width: 30px; height: 30px;
            border-radius: 50%;
            border: 2px solid rgba(255,255,255,0.6);
            background: rgba(255,255,255,0.2);
            display: flex; align-items: center; justify-content: center;
            font-size: 14px; color: white; font-weight: 600;
        }

        .user-name { font-size: 13px; color: rgba(255,255,255,0.85); }

        .signout-btn {
            background: rgba(255,255,255,0.15);
            border: 1px solid rgba(255,255,255,0.3);
            color: rgba(255,255,255,0.85);
            border-radius: 20px;
            padding: 4px 12px;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .signout-btn:hover { background: rgba(255,255,255,0.25); }

        /* ── Habit UI ─────────────────────────────────────────────────────── */
        .add-habit-section {
            background: white;
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        .add-habit-form { display: flex; gap: 10px; }

        #habitInput {
            flex: 1;
            padding: 12px 16px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 16px;
            outline: none;
        }
        #habitInput:focus { border-color: #667eea; }

        .btn { padding: 12px 24px; border: none; border-radius: 8px; font-size: 16px; font-weight: 600; cursor: pointer; transition: all 0.2s; }
        .btn-primary { background: #667eea; color: white; }
        .btn-primary:active { transform: scale(0.95); background: #5568d3; }

        .habits-list { display: flex; flex-direction: column; gap: 15px; }

        .habit-card {
            background: white;
            border-radius: 16px;
            padding: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            transition: box-shadow 0.2s, opacity 0.2s;
            cursor: grab;
            user-select: none;
        }
        .habit-card:active        { cursor: grabbing; }
        .habit-card.dragging      { opacity: 0.45; box-shadow: 0 12px 24px rgba(0,0,0,0.25); }
        .habit-card.drag-over     { box-shadow: 0 0 0 3px #667eea; }

        .habit-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; gap: 8px; }
        .habit-name   { font-size: 18px; font-weight: 600; color: #333; flex: 1; }

        .reorder-btns { display: flex; flex-direction: column; gap: 2px; }

        .reorder-btn {
            background: #f3f4f6; color: #6b7280;
            border: none; width: 28px; height: 22px;
            border-radius: 4px; font-size: 11px; cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            transition: background 0.15s;
        }
        .reorder-btn:hover    { background: #e5e7eb; color: #374151; }
        .reorder-btn:disabled { opacity: 0.3; cursor: default; }

        @media (hover: hover) and (pointer: fine) { .reorder-btns { display: none; } }

        .delete-btn {
            background: #ff4757; color: white;
            border: none; padding: 6px 12px; border-radius: 6px; font-size: 12px; cursor: pointer;
        }

        .streak-info { display: flex; gap: 20px; margin-bottom: 15px; }
        .streak-stat { flex: 1; text-align: center; padding: 10px; background: #f8f9fa; border-radius: 8px; }
        .streak-number { font-size: 24px; font-weight: 700; color: #667eea; }
        .streak-label  { font-size: 12px; color: #666; margin-top: 4px; }

        .calendar { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; margin-bottom: 15px; }
        .calendar-day {
            aspect-ratio: 1; border-radius: 4px; background: #f0f0f0;
            display: flex; align-items: center; justify-content: center;
            font-size: 10px; color: #999;
            cursor: pointer; transition: transform 0.1s;
        }
        .calendar-day:hover     { transform: scale(1.12); }
        .calendar-day.completed { background: linear-gradient(135deg, #667eea, #764ba2); color: white; font-weight: 600; }
        .calendar-day.today     { border: 2px solid #667eea; }

        .log-past-row { display: flex; gap: 8px; margin-top: 10px; }
        .log-past-input {
            flex: 1; padding: 10px 12px; border: 2px solid #e0e0e0;
            border-radius: 8px; font-size: 14px; outline: none; color: #333;
        }
        .log-past-input:focus { border-color: #667eea; }
        .btn-small {
            padding: 10px 16px; background: #667eea; color: white;
            border: none; border-radius: 8px; font-size: 14px; font-weight: 600; cursor: pointer;
        }
        .btn-small:active { transform: scale(0.95); background: #5568d3; }

        .check-btn {
            width: 100%; padding: 14px; background: #10b981;
            color: white; border: none; border-radius: 8px;
            font-size: 16px; font-weight: 600; cursor: pointer; transition: all 0.2s;
        }
        .check-btn:active  { transform: scale(0.98); }
        .check-btn.checked { background: #6b7280; }

        .achievements { margin-top: 15px; padding-top: 15px; border-top: 2px solid #f0f0f0; }
        .achievements-title { font-size: 14px; font-weight: 600; color: #666; margin-bottom: 10px; display: flex; align-items: center; gap: 6px; }
        .achievement-list { display: flex; gap: 8px; flex-wrap: wrap; }
        .achievement { padding: 8px 12px; border-radius: 20px; font-size: 13px; display: flex; align-items: center; gap: 6px; }
        .achievement.unlocked  { background: #fef3c7; color: #92400e; border: 2px solid #fbbf24; }
        .achievement.next-goal { background: #f0f4ff; color: #4b5da8; border: 2px dashed #a5b4fc; }
        .achievement.next-goal .goal-label { font-size: 11px; opacity: 0.75; margin-left: 2px; }

        .empty-state { text-align: center; padding: 40px 20px; color: white; }
        .empty-state h2 { font-size: 24px; margin-bottom: 10px; }
        .empty-state p  { font-size: 16px; opacity: 0.9; }
    </style>
</head>
<body>

    <!-- Loading -->
    <div id="loadingScreen">
        <div class="spinner"></div>
    </div>

    <!-- Login -->
    <div id="loginScreen" style="display:none;">
        <div class="login-card">
            <span class="login-icon">🎯</span>
            <div class="login-title">Habit<br>Tracker</div>
            <div class="login-subtitle">Earn your belts with every streak</div>

            <button class="google-btn" onclick="signInWithGoogle()">
                <svg width="20" height="20" viewBox="0 0 48 48">
                    <path fill="#FFC107" d="M43.6 20.1H42V20H24v8h11.3C33.6 32.9 29.2 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.1 7.9 3l5.7-5.7C34.5 6.5 29.5 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.7-.4-3.9z"/>
                    <path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.6 16.1 19 13 24 13c3.1 0 5.8 1.1 7.9 3l5.7-5.7C34.5 6.5 29.5 4 24 4 16.3 4 9.6 8.3 6.3 14.7z"/>
                    <path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.4 35.5 26.8 36 24 36c-5.2 0-9.6-3.1-11.3-7.5l-6.5 5C9.4 39.6 16.2 44 24 44z"/>
                    <path fill="#1976D2" d="M43.6 20.1H42V20H24v8h11.3c-.9 2.4-2.5 4.5-4.5 6l6.2 5.2C36.9 40.8 44 35 44 24c0-1.3-.1-2.7-.4-3.9z"/>
                </svg>
                Sign in with Google
            </button>

            <div class="login-footer">Your habits will sync across all your devices</div>
        </div>
    </div>

    <!-- App -->
    <div id="appScreen">
        <div class="container">
            <div class="header">
                <h1>🎯 Habit Tracker</h1>
                <p>Earn your belts with every streak!</p>
                <div class="user-bar" id="userBar"></div>
            </div>

            <div class="add-habit-section">
                <div class="add-habit-form">
                    <input type="text" id="habitInput" placeholder="Enter a new habit...">
                    <button class="btn btn-primary" onclick="addHabit()">Add</button>
                </div>
            </div>

            <div id="habitsList" class="habits-list"></div>
        </div>
    </div>

    <script type="module">
        import { initializeApp }
            from 'https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js';
        import { getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged }
            from 'https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js';
        import { getDatabase, ref, set, onValue }
            from 'https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js';

        const firebaseConfig = {
            apiKey: "AIzaSyA17mbLAmg4VmFJbvctfQd2MZpuNrPeWy4",
            authDomain: "habit-tracker-4ed02.firebaseapp.com",
            databaseURL: "https://habit-tracker-4ed02-default-rtdb.firebaseio.com",
            projectId: "habit-tracker-4ed02",
            storageBucket: "habit-tracker-4ed02.firebasestorage.app",
            messagingSenderId: "539719200764",
            appId: "1:539719200764:web:792848e42472bc64938c79"
        };

        const app      = initializeApp(firebaseConfig);
        const auth     = getAuth(app);
        const db       = getDatabase(app);
        const provider = new GoogleAuthProvider();

        let currentUserId    = null;
        let habits           = [];
        let dbUnsubscribe    = null;

        // ── Auth state ─────────────────────────────────────────────────────
        onAuthStateChanged(auth, (user) => {
            if (user) {
                currentUserId = user.uid;
                showApp(user);
                setupDbListener();
            } else {
                currentUserId = null;
                if (dbUnsubscribe) { dbUnsubscribe(); dbUnsubscribe = null; }
                habits = [];
                showLogin();
            }
        });

        function showLogin() {
            document.getElementById('loadingScreen').style.display = 'none';
            document.getElementById('loginScreen').style.display   = 'flex';
            document.getElementById('appScreen').style.display     = 'none';
        }

        function showApp(user) {
            document.getElementById('loadingScreen').style.display = 'none';
            document.getElementById('loginScreen').style.display   = 'none';
            document.getElementById('appScreen').style.display     = 'block';

            const bar        = document.getElementById('userBar');
            const initial    = (user.displayName || user.email || '?')[0].toUpperCase();
            const avatarHtml = user.photoURL
                ? `<img class="user-avatar" src="${user.photoURL}" referrerpolicy="no-referrer" alt="avatar">`
                : `<div class="user-avatar-placeholder">${initial}</div>`;

            bar.innerHTML = `
                ${avatarHtml}
                <span class="user-name">${user.displayName || user.email || 'Signed in'}</span>
                <button class="signout-btn" onclick="handleSignOut()">Sign out</button>
            `;
        }

        // ── Sign in / out ──────────────────────────────────────────────────
        async function signInWithGoogle() {
            try {
                await signInWithPopup(auth, provider);
            } catch (err) {
                console.error('Sign-in error:', err);
                alert('Sign-in failed — please try again.');
            }
        }

        async function handleSignOut() {
            habits = [];
            await signOut(auth);
        }

        window.signInWithGoogle = signInWithGoogle;
        window.handleSignOut    = handleSignOut;

        // ── Firebase realtime data ─────────────────────────────────────────
        function setupDbListener() {
            if (dbUnsubscribe) dbUnsubscribe();
            const habitsRef = ref(db, `users/${currentUserId}/habits`);
            dbUnsubscribe   = onValue(habitsRef, (snapshot) => {
                const val = snapshot.val();
                // Firebase stores arrays as objects with numeric keys — convert back to array
                if (!val) {
                    habits = [];
                } else if (Array.isArray(val)) {
                    habits = val;
                } else {
                    habits = Object.values(val);
                }
                // Ensure each habit's completions is always a real array
                habits = habits.map(h => ({
                    ...h,
                    completions: h.completions
                        ? (Array.isArray(h.completions) ? h.completions : Object.values(h.completions))
                        : []
                }));
                renderHabits();
            });
        }

        function saveHabits() {
            if (!currentUserId) return;
            // Store as a keyed object so Firebase round-trips cleanly
            const habitsObj = {};
            habits.forEach((h, i) => { habitsObj[i] = { ...h, completions: h.completions || [] }; });
            set(ref(db, `users/${currentUserId}/habits`), habitsObj).catch(console.error);
        }

        // ── Habit CRUD ─────────────────────────────────────────────────────
        function addHabit() {
            const input = document.getElementById('habitInput');
            const name  = input.value.trim();
            if (!name) return;
            habits.push({ id: Date.now(), name, completions: [], createdAt: new Date().toISOString() });
            input.value = '';
            renderHabits();   // render immediately for snappy UI
            saveHabits();     // then persist (listener will re-render again, that's fine)
        }

        function deleteHabit(id) {
            if (!confirm('Delete this habit?')) return;
            habits = habits.filter(h => h.id !== id);
            renderHabits();
            saveHabits();
        }

        function toggleHabit(id) {
            toggleHabitDate(id, getTodayString());
        }

        // Toggles completion for any date (today or in the past). Used by the
        // "Mark Complete" button, calendar day clicks, and the past-date picker.
        function toggleHabitDate(id, dateStr) {
            if (dateStr > getTodayString()) return; // no logging future days
            const habit = habits.find(h => h.id === id);
            if (!habit) return;
            if (habit.completions.includes(dateStr)) {
                habit.completions = habit.completions.filter(d => d !== dateStr);
            } else {
                habit.completions.push(dateStr);
            }
            renderHabits();
            saveHabits();
        }

        function logPastDate(id) {
            const input = document.getElementById(`pastDate-${id}`);
            if (!input || !input.value) return;
            toggleHabitDate(id, input.value);
        }

        function moveHabit(id, direction) {
            const idx    = habits.findIndex(h => h.id === id);
            const newIdx = idx + direction;
            if (newIdx < 0 || newIdx >= habits.length) return;
            [habits[idx], habits[newIdx]] = [habits[newIdx], habits[idx]];
            renderHabits();
            saveHabits();
        }

        window.addHabit       = addHabit;
        window.deleteHabit    = deleteHabit;
        window.toggleHabit    = toggleHabit;
        window.toggleHabitDate = toggleHabitDate;
        window.logPastDate    = logPastDate;
        window.moveHabit      = moveHabit;

        // ── Helpers ────────────────────────────────────────────────────────
        const ACHIEVEMENTS = [
            { id: 'white',  name: '⚪ White Belt',  threshold: 3   },
            { id: 'yellow', name: '🟡 Yellow Belt', threshold: 7   },
            { id: 'orange', name: '🟠 Orange Belt', threshold: 14  },
            { id: 'green',  name: '🟢 Green Belt',  threshold: 30  },
            { id: 'blue',   name: '🔵 Blue Belt',   threshold: 50  },
            { id: 'purple', name: '🟣 Purple Belt', threshold: 100 },
            { id: 'black',  name: '⚫ Black Belt',  threshold: 365 }
        ];

        function getTodayString() {
            const n = new Date();
            return `${n.getFullYear()}-${String(n.getMonth()+1).padStart(2,'0')}-${String(n.getDate()).padStart(2,'0')}`;
        }

        function calculateStreak(completions) {
            if (!completions.length) return 0;
            const today  = new Date(); today.setHours(0,0,0,0);
            const sorted = [...completions].sort().reverse();
            let streak   = 0;
            for (let i = 0; i < sorted.length; i++) {
                const d = new Date(sorted[i]); d.setHours(0,0,0,0);
                if (Math.floor((today - d) / 86400000) === i) streak++; else break;
            }
            return streak;
        }

        function getLongestStreak(completions) {
            if (!completions.length) return 0;
            const sorted = [...completions].sort();
            let max = 1, cur = 1;
            for (let i = 1; i < sorted.length; i++) {
                const diff = Math.floor((new Date(sorted[i]) - new Date(sorted[i-1])) / 86400000);
                if (diff === 1) { cur++; max = Math.max(max, cur); } else if (diff > 1) cur = 1;
            }
            return Math.max(max, calculateStreak(completions));
        }

        function getCalendarDays() {
            const days = [], today = new Date();
            for (let i = 27; i >= 0; i--) {
                const d = new Date(today); d.setDate(d.getDate() - i); days.push(d);
            }
            return days;
        }

        function getAchievementDisplay(longestStreak) {
            return {
                unlocked: ACHIEVEMENTS.filter(a => longestStreak >= a.threshold),
                nextGoal: ACHIEVEMENTS.find(a => longestStreak < a.threshold) || null
            };
        }

        // ── Render ─────────────────────────────────────────────────────────
        function renderHabits() {
            const container = document.getElementById('habitsList');
            if (!container) return;

            if (!habits.length) {
                container.innerHTML = `
                    <div class="empty-state">
                        <h2>No habits yet!</h2>
                        <p>Add your first habit above to get started</p>
                    </div>`;
                return;
            }

            const today = getTodayString();
            container.innerHTML = habits.map((habit, idx) => {
                const currentStreak  = calculateStreak(habit.completions);
                const longestStreak  = getLongestStreak(habit.completions);
                const totalDays      = habit.completions.length;
                const isCheckedToday = habit.completions.includes(today);
                const { unlocked, nextGoal } = getAchievementDisplay(longestStreak);
                const isFirst = idx === 0, isLast = idx === habits.length - 1;

                const calHtml = getCalendarDays().map(date => {
                    const ds = `${date.getFullYear()}-${String(date.getMonth()+1).padStart(2,'0')}-${String(date.getDate()).padStart(2,'0')}`;
                    return `<div class="calendar-day ${habit.completions.includes(ds) ? 'completed' : ''} ${ds === today ? 'today' : ''}" onclick="toggleHabitDate(${habit.id}, '${ds}')" title="${ds}">${date.getDate()}</div>`;
                }).join('');

                const achieveHtml = (unlocked.length > 0 || nextGoal) ? `
                    <div class="achievements">
                        <div class="achievements-title">🏆 Achievements</div>
                        <div class="achievement-list">
                            ${unlocked.map(a => `<div class="achievement unlocked">${a.name}</div>`).join('')}
                            ${nextGoal ? `<div class="achievement next-goal">${nextGoal.name}<span class="goal-label">(${nextGoal.threshold - longestStreak}d away)</span></div>` : ''}
                        </div>
                    </div>` : '';

                return `
                    <div class="habit-card" draggable="true" data-id="${habit.id}">
                        <div class="habit-header">
                            <div class="habit-name">${habit.name}</div>
                            <div class="reorder-btns">
                                <button class="reorder-btn" onclick="moveHabit(${habit.id},-1)" ${isFirst?'disabled':''}>▲</button>
                                <button class="reorder-btn" onclick="moveHabit(${habit.id}, 1)" ${isLast ?'disabled':''}>▼</button>
                            </div>
                            <button class="delete-btn" onclick="deleteHabit(${habit.id})">Delete</button>
                        </div>
                        <div class="streak-info">
                            <div class="streak-stat"><div class="streak-number">${currentStreak}</div><div class="streak-label">Current</div></div>
                            <div class="streak-stat"><div class="streak-number">${longestStreak}</div><div class="streak-label">Best</div></div>
                            <div class="streak-stat"><div class="streak-number">${totalDays}</div><div class="streak-label">Total</div></div>
                        </div>
                        <div class="calendar">${calHtml}</div>
                        <button class="check-btn ${isCheckedToday?'checked':''}" onclick="toggleHabit(${habit.id})">
                            ${isCheckedToday ? '✓ Completed Today' : 'Mark Complete'}
                        </button>
                        <div class="log-past-row">
                            <input type="date" class="log-past-input" id="pastDate-${habit.id}" max="${today}" aria-label="Date to log">
                            <button class="btn-small" onclick="logPastDate(${habit.id})">Log Day</button>
                        </div>
                        ${achieveHtml}
                    </div>`;
            }).join('');

            attachDragListeners();
        }

        // ── Drag-and-drop ──────────────────────────────────────────────────
        function attachDragListeners() {
            let dragSrcId = null;
            document.querySelectorAll('.habit-card').forEach(card => {
                card.addEventListener('dragstart', e => {
                    dragSrcId = Number(card.dataset.id);
                    card.classList.add('dragging');
                    e.dataTransfer.effectAllowed = 'move';
                });
                card.addEventListener('dragend', () => {
                    card.classList.remove('dragging');
                    document.querySelectorAll('.habit-card').forEach(c => c.classList.remove('drag-over'));
                });
                card.addEventListener('dragover', e => {
                    e.preventDefault();
                    document.querySelectorAll('.habit-card').forEach(c => c.classList.remove('drag-over'));
                    card.classList.add('drag-over');
                });
                card.addEventListener('drop', e => {
                    e.preventDefault();
                    const dropId = Number(card.dataset.id);
                    if (dragSrcId === dropId) return;
                    const srcIdx  = habits.findIndex(h => h.id === dragSrcId);
                    const dropIdx = habits.findIndex(h => h.id === dropId);
                    const [removed] = habits.splice(srcIdx, 1);
                    habits.splice(dropIdx, 0, removed);
                    saveHabits();
                });
            });
        }

        document.getElementById('habitInput').addEventListener('keypress', e => {
            if (e.key === 'Enter') addHabit();
        });
    </script>
</body>
</html>
